# Continuous integration: GitHub runs the tests on a fresh Linux machine after every push
# and on pull requests. The result shows as a tick or cross next to each commit.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip  # reuse downloaded packages between runs
          cache-dependency-path: requirements-test.txt

      - name: Install libraries
        run: pip install -r requirements-test.txt

      # The trained model isn't in the repo, so the tests download it from Hugging Face
      - name: Cache the model download
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-cats-vs-dogs-efficientnet-b0

      - name: Run tests
        run: python -m pytest -v
