# Continuous integration: GitHub runs the tests on a fresh Linux machine after every push
# and on pull requests. The result shows as a tick or cross next to each commit.
name: Tests

on:
  push:
  pull_request:

# The workflow only needs to read the code. Without this, its access token can also write to
# the repo, which a compromised third-party action could misuse.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip  # reuse downloaded packages between runs
          cache-dependency-path: requirements-test.txt

      - name: Install libraries
        run: pip install -r requirements-test.txt

      # The trained model isn't in the repo, so the tests download it from Hugging Face
      - name: Cache the model download
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-cats-vs-dogs-efficientnet-b0

      - name: Run tests
        run: python -m pytest -v

  # Second job, runs at the same time: build the Docker image and check the API inside it works
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t cats-vs-dogs-api .

      - name: Start the container
        run: |
          docker run -d --name api -p 8000:8000 cats-vs-dogs-api
          # Wait up to 60 s for the server to start
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 1; done

      - name: Call the API
        run: |
          curl -sf http://localhost:8000/health
          curl -sf -F "file=@tests/images/cat.jpg" http://localhost:8000/predict | tee cat.json
          curl -sf -F "file=@tests/images/dog.jpg" http://localhost:8000/predict | tee dog.json
          grep -q '"label":"Cat"' cat.json
          grep -q '"label":"Dog"' dog.json

      - name: Show the server log if something failed
        if: failure()
        run: docker logs api
